name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unit tests (Vitest) — pure logic, no network, no AI calls
  # Runs in ~15 s on a cold runner.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          # Placeholder values — real keys are never used in unit tests because
          # ai-client and env are mocked via vi.mock() in every test file.
          SHOPIFY_ADMIN_ACCESS_TOKEN: ci-placeholder
          CRON_SECRET: ci-placeholder
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder

  # ─────────────────────────────────────────────────────────────────────────────
  # TypeScript type check — must pass before any deploy
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit
